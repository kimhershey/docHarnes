[package]
name = "doculens-core"
description = "DocuLens core: settings, workspace, hardware tiering, model registry (no UI dependencies)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = ["nvml"]
# NVIDIA NVML probing (nvml.dll / libnvidia-ml.so is loaded dynamically at runtime; absence is not an error)
nvml = ["dep:nvml-wrapper"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
chrono.workspace = true
uuid.workspace = true
dirs.workspace = true
sysinfo.workspace = true
nvml-wrapper = { workspace = true, optional = true }
sha2.workspace = true
blake3.workspace = true
ureq.workspace = true
notify.workspace = true
rusqlite.workspace = true
pdfium-render.workspace = true
zip.workspace = true
quick-xml.workspace = true
image.workspace = true
trash.workspace = true
hwp.workspace = true
unicode-normalization.workspace = true
regex.workspace = true
lopdf.workspace = true
lindera.workspace = true
sqlite-vec.workspace = true
rust_xlsxwriter.workspace = true
csv.workspace = true
pdf-writer.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "engine_process"
harness = false
