[package]
name = "doculens"
description = "DocuLens desktop shell (Tauri 2)"
authors = ["DocuLens contributors"]
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
name = "doculens_lib"
# Desktop-only app: the mobile `staticlib` / `cdylib` outputs are not built (≈1.8 GB of artifacts per build).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
doculens-core = { path = "../crates/doculens-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
# OS toast when a long job finishes (design §3.9; MIT OR Apache-2.0).
tauri-plugin-notification = "2"
serde.workspace = true
serde_json.workspace = true
log.workspace = true
chrono.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Printing converted documents to PDF through WebKitGTK (dev / CI builds only).
gtk = "0.18"
webkit2gtk = "2.0"

[target.'cfg(windows)'.dependencies]
# WebView2 `PrintToPdf` for converted documents (same versions wry uses).
webview2-com = "0.39"
windows-core = "0.62"
# Sleep prevention during batches (`SetThreadExecutionState`, design §3.9).
windows-sys.workspace = true
