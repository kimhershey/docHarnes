name: CI

# Third-party actions are pinned to a commit (the trailing comment names the release that commit is). The manual
# release workflows use the same pins, so a green CI run also proves that every pin still resolves before an
# installer build is dispatched. dtolnay/rust-toolchain is pinned on its master branch — the per-toolchain branches
# such as `stable` are rewritten and garbage-collected — and therefore takes `toolchain: stable` as an input.

on:
  push:
    branches: ["main", "phase/**", "release/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust (core + tauri shell, Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config patchelf
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Resolve the pinned PDFium build
        id: pdfium
        run: echo "tag=$(node -p "require('./engines/pdfium.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache PDFium
        id: pdfium-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/pdfium
          key: pdfium-linux-x64-${{ steps.pdfium.outputs.tag }}
      - name: Fetch PDFium (bblanchon/pdfium-binaries, sha256 pinned)
        if: steps.pdfium-cache.outputs.cache-hit != 'true'
        run: node scripts/fetch-pdfium.mjs --dest /tmp/pdfium
      - name: Resolve the pinned ko-dic dictionary
        id: kodic
        run: echo "ver=$(node -p "require('./engines/kodic.json').version")-lindera$(node -p "require('./engines/kodic.json').lindera")" >> "$GITHUB_OUTPUT"
      - name: Cache the built ko-dic dictionary
        id: kodic-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/kodic
          key: kodic-${{ steps.kodic.outputs.ver }}-${{ hashFiles('crates/doculens-kodic/**', 'engines/kodic.json', 'scripts/fetch-kodic.mjs') }}
      - name: Build ko-dic (mecab-ko-dic, sha256 pinned → lindera format)
        if: steps.kodic-cache.outputs.cache-hit != 'true'
        run: node scripts/fetch-kodic.mjs --dest /tmp/kodic
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          DOCULENS_PDFIUM: /tmp/pdfium/libpdfium.so
          DOCULENS_KODIC: /tmp/kodic

  web:
    name: Web (typecheck, unit, build, e2e)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run nsis:check
      - run: npm test
      # Node's own test runner, no dependencies: the scripts the release depends on (version check, npm license
      # gate, release guard with a fake `gh`, PE import reader with synthetic images).
      - name: Script tests (scripts/tests)
        run: node --test "scripts/tests/*.test.mjs"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  engine-real:
    name: Real llama-server (CPU) + tiny Gemma 4 fixture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Resolve the pinned llama.cpp tag
        id: tag
        run: echo "tag=$(node -p "require('./engines/manifest.json').tag")" >> "$GITHUB_OUTPUT"
      - name: Cache the llama-server CPU build
        id: engine-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/engine/bin
          key: llama-server-cpu-${{ steps.tag.outputs.tag }}-ubuntu-24.04-v2
      - name: Build llama-server (CPU only) from the pinned tag
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          # The release only ships CUDA / OpenVINO / ROCm packages for Linux, and
          # ggml would load every backend library next to the binary, so a plain
          # CPU build (static CPU backend, no dynamic loading) is built from source.
          TAG="${{ steps.tag.outputs.tag }}"
          git clone --depth 1 --branch "$TAG" https://github.com/ggml-org/llama.cpp /tmp/engine/src
          # Static libraries → one self-contained binary that survives the cache
          # restore (a shared build keeps an RPATH into the vanished build tree).
          cmake -S /tmp/engine/src -B /tmp/engine/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=OFF \
            -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_RPATH='$ORIGIN' -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=ON
          cmake --build /tmp/engine/build --config Release --target llama-server -j "$(nproc)"
          mkdir -p /tmp/engine/bin && cp /tmp/engine/build/bin/* /tmp/engine/bin/
      - name: Point the test at the engine
        run: |
          BIN=/tmp/engine/bin/llama-server
          test -x "$BIN"
          ldd "$BIN" | grep -i "not found" && exit 1
          echo "libraries next to the binary:"; ls /tmp/engine/bin | grep -i ggml || true
          test -z "$(ls /tmp/engine/bin | grep -iE 'openvino|vulkan|cuda|rocm')"
          echo "DOCULENS_LLAMA_SERVER=$BIN" >> "$GITHUB_ENV"
          "$BIN" --version || true
      - run: cargo test -p doculens-core --test real_engine -- --nocapture
        env:
          DOCULENS_TEST_MODELS_DIR: ${{ github.workspace }}/crates/doculens-core/tests/fixtures

  license:
    name: License gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run licenses:check
      # cargo-deny as a prebuilt, checksum-verified binary (the Docker-based cargo-deny-action
      # downloads its binary unauthenticated at image build time and hit "gzip: invalid magic"
      # on two consecutive runs); pinned to the version verified locally.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check licenses bans sources

  windows-check:
    name: Windows compile check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Resolve the pinned PDFium build
        id: pdfium
        shell: bash
        run: echo "tag=$(node -p "require('./engines/pdfium.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache PDFium
        id: pdfium-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\pdfium
          key: pdfium-windows-x64-${{ steps.pdfium.outputs.tag }}
      # The Windows job is a compile check: when the release download is unavailable (GitHub
      # answered 504 for over an hour on 2026-11-08) it still compiles and runs the tests, which
      # skip the PDFium render / import cases when the library is missing; the Linux job keeps
      # strict PDFium coverage.
      - name: Fetch PDFium (Windows build, sha256 pinned)
        id: pdfium-fetch
        if: steps.pdfium-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: node scripts/fetch-pdfium.mjs --dest "$env:RUNNER_TEMP\pdfium"
      - name: Warn when PDFium is unavailable
        if: steps.pdfium-fetch.outcome == 'failure'
        shell: bash
        run: echo "::warning::PDFium download failed; the Windows run compiles and tests without the PDFium render / import tests"
      - name: Resolve the pinned ko-dic dictionary
        id: kodic
        shell: bash
        run: echo "ver=$(node -p "require('./engines/kodic.json').version")-lindera$(node -p "require('./engines/kodic.json').lindera")" >> "$GITHUB_OUTPUT"
      - name: Cache the built ko-dic dictionary
        id: kodic-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\kodic
          key: kodic-windows-${{ steps.kodic.outputs.ver }}-${{ hashFiles('crates/doculens-kodic/**', 'engines/kodic.json', 'scripts/fetch-kodic.mjs') }}
      - name: Build ko-dic (Windows)
        if: steps.kodic-cache.outputs.cache-hit != 'true'
        run: node scripts/fetch-kodic.mjs --dest "$env:RUNNER_TEMP\kodic"
      - run: cargo check --workspace
      - run: cargo test -p doculens-core
        env:
          DOCULENS_PDFIUM: ${{ runner.temp }}\pdfium\pdfium.dll
          DOCULENS_KODIC: ${{ runner.temp }}\kodic

  notices:
    name: Third-party notices / SBOM up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # Fails in seconds when a version bump missed a file: the release workflows name the installer and the tag
      # after src-tauri/tauri.conf.json, and a stale Cargo.lock breaks `cargo metadata --locked` below. On a
      # release/<version> branch the version must also be the one in the branch name (GITHUB_REF_NAME).
      - name: Versions agree (Cargo.toml / Cargo.lock, package.json / lock, tauri.conf.json, mock backend, SBOM)
        run: node scripts/check-versions.mjs
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
      - run: npm ci
      - name: Regenerate THIRD-PARTY-NOTICES.md, sbom.cdx.json and the license texts
        run: node scripts/gen-notices.mjs
      - name: Fail when the committed notices / SBOM are stale (run `npm run notices` and commit)
        run: git diff --exit-code -- THIRD-PARTY-NOTICES.md sbom.cdx.json
      - name: License texts were generated
        run: test -s src-tauri/resources/licenses/THIRD-PARTY-LICENSES.txt

  eval-gate:
    name: Planner golden set (eval harness, 0.5 pt regression gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Golden set vs baseline (fails when accuracy drops by more than 0.5 pt)
        run: cargo run -p doculens-eval -- planner --golden eval/golden/planner.json --baseline eval/baselines/planner-rules.json --out eval/out/planner-rules.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: planner-eval-results
          path: eval/out/planner-rules.json
