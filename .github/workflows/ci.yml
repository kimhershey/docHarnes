name: CI

on:
  push:
    branches: ["main", "phase/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust (core + tauri shell, Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Resolve the pinned PDFium build
        id: pdfium
        run: echo "tag=$(node -p "require('./engines/pdfium.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache PDFium
        id: pdfium-cache
        uses: actions/cache@v4
        with:
          path: /tmp/pdfium
          key: pdfium-linux-x64-${{ steps.pdfium.outputs.tag }}
      - name: Fetch PDFium (bblanchon/pdfium-binaries, sha256 pinned)
        if: steps.pdfium-cache.outputs.cache-hit != 'true'
        run: node scripts/fetch-pdfium.mjs --dest /tmp/pdfium
      - name: Resolve the pinned ko-dic dictionary
        id: kodic
        run: echo "ver=$(node -p "require('./engines/kodic.json').version")-lindera$(node -p "require('./engines/kodic.json').lindera")" >> "$GITHUB_OUTPUT"
      - name: Cache the built ko-dic dictionary
        id: kodic-cache
        uses: actions/cache@v4
        with:
          path: /tmp/kodic
          key: kodic-${{ steps.kodic.outputs.ver }}-${{ hashFiles('crates/doculens-kodic/**', 'engines/kodic.json', 'scripts/fetch-kodic.mjs') }}
      - name: Build ko-dic (mecab-ko-dic, sha256 pinned → lindera format)
        if: steps.kodic-cache.outputs.cache-hit != 'true'
        run: node scripts/fetch-kodic.mjs --dest /tmp/kodic
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          DOCULENS_PDFIUM: /tmp/pdfium/libpdfium.so
          DOCULENS_KODIC: /tmp/kodic

  web:
    name: Web (typecheck, unit, build, e2e)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  engine-real:
    name: Real llama-server (CPU) + tiny Qwen3.5 fixture
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Resolve the pinned llama.cpp tag
        id: tag
        run: echo "tag=$(node -p "require('./engines/manifest.json').tag")" >> "$GITHUB_OUTPUT"
      - name: Cache the llama-server CPU build
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: /tmp/engine/bin
          key: llama-server-cpu-${{ steps.tag.outputs.tag }}-ubuntu-24.04-v2
      - name: Build llama-server (CPU only) from the pinned tag
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          # The release only ships CUDA / OpenVINO / ROCm packages for Linux, and
          # ggml would load every backend library next to the binary, so a plain
          # CPU build (static CPU backend, no dynamic loading) is built from source.
          TAG="${{ steps.tag.outputs.tag }}"
          git clone --depth 1 --branch "$TAG" https://github.com/ggml-org/llama.cpp /tmp/engine/src
          # Static libraries → one self-contained binary that survives the cache
          # restore (a shared build keeps an RPATH into the vanished build tree).
          cmake -S /tmp/engine/src -B /tmp/engine/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=OFF \
            -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_RPATH='$ORIGIN' -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=ON
          cmake --build /tmp/engine/build --config Release --target llama-server -j "$(nproc)"
          mkdir -p /tmp/engine/bin && cp /tmp/engine/build/bin/* /tmp/engine/bin/
      - name: Point the test at the engine
        run: |
          BIN=/tmp/engine/bin/llama-server
          test -x "$BIN"
          ldd "$BIN" | grep -i "not found" && exit 1
          echo "libraries next to the binary:"; ls /tmp/engine/bin | grep -i ggml || true
          test -z "$(ls /tmp/engine/bin | grep -iE 'openvino|vulkan|cuda|rocm')"
          echo "DOCULENS_LLAMA_SERVER=$BIN" >> "$GITHUB_ENV"
          "$BIN" --version || true
      - run: cargo test -p doculens-core --test real_engine -- --nocapture
        env:
          DOCULENS_TEST_MODELS_DIR: ${{ github.workspace }}/crates/doculens-core/tests/fixtures

  license:
    name: License gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run licenses:check
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  windows-check:
    name: Windows compile check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch PDFium (Windows build, sha256 pinned)
        run: node scripts/fetch-pdfium.mjs --dest "$env:RUNNER_TEMP\pdfium"
      - name: Resolve the pinned ko-dic dictionary
        id: kodic
        shell: bash
        run: echo "ver=$(node -p "require('./engines/kodic.json').version")-lindera$(node -p "require('./engines/kodic.json').lindera")" >> "$GITHUB_OUTPUT"
      - name: Cache the built ko-dic dictionary
        id: kodic-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\kodic
          key: kodic-windows-${{ steps.kodic.outputs.ver }}-${{ hashFiles('crates/doculens-kodic/**', 'engines/kodic.json', 'scripts/fetch-kodic.mjs') }}
      - name: Build ko-dic (Windows)
        if: steps.kodic-cache.outputs.cache-hit != 'true'
        run: node scripts/fetch-kodic.mjs --dest "$env:RUNNER_TEMP\kodic"
      - run: cargo check --workspace
      - run: cargo test -p doculens-core
        env:
          DOCULENS_PDFIUM: ${{ runner.temp }}\pdfium\pdfium.dll
          DOCULENS_KODIC: ${{ runner.temp }}\kodic

  notices:
    name: Third-party notices / SBOM up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
      - run: npm ci
      - name: Regenerate THIRD-PARTY-NOTICES.md, sbom.cdx.json and the license texts
        run: node scripts/gen-notices.mjs
      - name: Fail when the committed notices / SBOM are stale (run `npm run notices` and commit)
        run: git diff --exit-code -- THIRD-PARTY-NOTICES.md sbom.cdx.json
      - name: License texts were generated
        run: test -s src-tauri/resources/licenses/THIRD-PARTY-LICENSES.txt

  eval-gate:
    name: Planner golden set (eval harness, 0.5 pt regression gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Golden set vs baseline (fails when accuracy drops by more than 0.5 pt)
        run: cargo run -p doculens-eval -- planner --golden eval/golden/planner.json --baseline eval/baselines/planner-rules.json --out eval/out/planner-rules.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planner-eval-results
          path: eval/out/planner-rules.json
