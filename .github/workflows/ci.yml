name: CI

on:
  push:
    branches: ["main", "phase/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust (core + tauri shell, Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    name: Web (typecheck, unit, build, e2e)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  engine-real:
    name: Real llama-server (CPU) + tiny Qwen3.5 fixture
    runs-on: ubuntu-24.04
    # The release asset names are matched by pattern; verified on the first run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download the pinned llama.cpp release (ubuntu x64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(node -p "require('./engines/manifest.json').tag")
          mkdir -p /tmp/engine && cd /tmp/engine
          gh release download "$TAG" --repo ggml-org/llama.cpp --pattern '*ubuntu*x64*' --dir .
          ls -la
          for f in *.zip; do [ -f "$f" ] && unzip -q "$f"; done
          for f in *.tar.gz; do [ -f "$f" ] && tar -xzf "$f"; done
          BIN=$(find . -type f -name llama-server | head -1)
          test -n "$BIN"
          chmod +x "$BIN"
          echo "DOCULENS_LLAMA_SERVER=$(readlink -f "$BIN")" >> "$GITHUB_ENV"
          "$BIN" --version || true
      - run: cargo test -p doculens-core --test real_engine -- --nocapture
        env:
          DOCULENS_TEST_MODELS_DIR: ${{ github.workspace }}/crates/doculens-core/tests/fixtures

  license:
    name: License gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run licenses:check
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  windows-check:
    name: Windows compile check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      - run: cargo test -p doculens-core
