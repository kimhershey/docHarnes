name: Windows installer (manual)

# Builds the NSIS installer (design §3.12) on a GitHub-hosted Windows runner and, with publish=true, attaches it to
# the GitHub Release v<version> (src-tauri/tauri.conf.json version; the release is created when it does not exist).
#
#   lite  = app + llama-server CPU & Vulkan packs (official llama.cpp release zips) + PDFium + ko-dic.
#           Models (3–8 GB) are never bundled: the user downloads or drops them in from the model manager.
#   full  = lite + the self-built CUDA packs cu121 / cu129, downloaded from the Release assets that
#           .github/workflows/cuda-packs.yml publishes (DocuLens-EnginePack-<pack>-<tag>.zip). The packs belong to
#           a llama.cpp tag, not to an app version: the step below reads them from the Release recorded for the
#           engine tag (CUDA_PACK_RELEASES) and refuses a pack without its .sha256 file.
#
# Publishing (publish=true): tag v<version> must not already exist on another commit than the one built —
# scripts/release-guard.mjs checks it before the build and again before the upload. `gh release upload --clobber`
# would otherwise replace the installer of a published Release with a build of other source while the tag stays on
# the old commit (this happened to v0.1.0). allow_overwrite=true is the explicit way to do that on purpose.
#
# Bundled layout inside the installer (Tauri resource dir = install dir): engines/<pack>/llama-server.exe, pdfium/,
# ko-dic/, THIRD-PARTY-NOTICES.md, sbom.cdx.json, licenses/THIRD-PARTY-LICENSES.txt.
#
# WebView2 stays in `downloadBootstrapper` mode (src-tauri/tauri.conf.json `webviewInstallMode`): the offline /
# fixed-runtime installers are Microsoft-proprietary redistributables whose EULA conditions (unmodified
# redistribution, notice text, user consent for a silent install) are not covered yet — design appendix E.
# Windows 10 1803+ / 11 ship the runtime as an OS component, so the bootstrapper usually has nothing to download.
#
# The installer is not code-signed: SmartScreen shows "Windows protected your PC" on first run. The .sha256 file next
# to the installer lets users verify the download (`certutil -hashfile <exe> SHA256`).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag or commit SHA). Empty = the branch this workflow is run from"
        required: false
        default: ""
      variant:
        description: "Installer variant (lite = CPU/Vulkan packs, full = + CUDA packs from the Release assets)"
        type: choice
        options: [lite, full]
        default: lite
      publish:
        description: "Upload the installer, its SHA-256, THIRD-PARTY-NOTICES.md and sbom.cdx.json to Release v<version>"
        type: boolean
        default: false
      allow_overwrite:
        description: "With publish: replace the assets of Release v<version> even though its tag is on another commit than the one built (default: fail)"
        type: boolean
        default: false

# Read-only by default; only the job below gets a write token, for its publish step. (The build steps of that job
# still run with it — moving the upload into a small second job is the remaining part of PKG-14.)
permissions:
  contents: read

jobs:
  build:
    name: Build NSIS installer (${{ inputs.variant }})
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      # Authenticates scripts/fetch-engine.mjs (GitHub API rate limit) and `gh release …`.
      GH_TOKEN: ${{ github.token }}
      # Release downloads: more retries than the default 4 (scripts/lib/fetch-retry.mjs).
      DOCULENS_FETCH_ATTEMPTS: "6"
    steps:
      # Third-party actions are pinned to a commit; the comment names the release that commit is.
      # An empty ref makes actions/checkout use the commit the workflow was dispatched on.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # Before the long build: the installer name and the Release tag come from src-tauri/tauri.conf.json, so every
      # other place that records the version must agree, and a build dispatched on release/<version> must be that
      # version (scripts/check-versions.mjs reads the branch from GITHUB_REF_NAME).
      - name: Versions agree (Cargo.toml / Cargo.lock, package.json / lock, tauri.conf.json, mock backend, SBOM)
        run: node scripts/check-versions.mjs
      # Fails in the first minute instead of after the build when the tag already belongs to other source.
      - name: Release guard — tag v<version> must not exist on another commit (publish only)
        if: inputs.publish
        run: node scripts/release-guard.mjs --allow-overwrite "${{ inputs.allow_overwrite }}"
      # dtolnay/rust-toolchain: a pinned commit must be on its master branch (the per-toolchain branches such as
      # `stable` are rewritten and garbage-collected), and master takes the toolchain as an input.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: npm ci

      - name: Resolve version, engine tag and installer name
        id: meta
        shell: pwsh
        run: |
          $version = node -p "require('./src-tauri/tauri.conf.json').version"
          $tag = node -p "require('./engines/manifest.json').tag"
          $variant = (Get-Culture).TextInfo.ToTitleCase("${{ inputs.variant }}")
          "version=$version" >> $env:GITHUB_OUTPUT
          "engine_tag=$tag" >> $env:GITHUB_OUTPUT
          "variant=$variant" >> $env:GITHUB_OUTPUT
          "installer=DocuLens-Setup-$variant-$version-x64.exe" >> $env:GITHUB_OUTPUT
          Write-Host "DocuLens $version, llama.cpp $tag, variant $variant"

      # --- bundled runtime assets → src-tauri/resources/ (git-ignored, picked up by tauri.conf.json bundle.resources)
      - name: Fetch llama-server packs (cpu, vulkan) → src-tauri/resources/engines/<pack>/
        run: node scripts/fetch-engine.mjs --bundle --packs cpu,vulkan
      - name: Show the fetched pack hashes (pin them in engines/manifest.json with `--pin` once)
        shell: pwsh
        run: Get-ChildItem src-tauri/resources/engines/*/pack.json | ForEach-Object { Write-Host "--- $($_.Directory.Name)"; Get-Content $_.FullName }
      - name: Fetch PDFium → src-tauri/resources/pdfium/
        run: node scripts/fetch-pdfium.mjs --bundle
      - name: Cache the built ko-dic dictionary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: src-tauri/resources/ko-dic
          key: kodic-bundle-windows-${{ hashFiles('engines/kodic.json', 'crates/doculens-kodic/**', 'scripts/fetch-kodic.mjs') }}
      - name: Build ko-dic → src-tauri/resources/ko-dic/ (no-op when the cache holds this version)
        run: node scripts/fetch-kodic.mjs --bundle

      - name: Download the CUDA packs from the GitHub Release (full variant)
        if: inputs.variant == 'full'
        shell: pwsh
        env:
          # Home of the self-built packs per llama.cpp tag: "<engine tag>=<release tag>" pairs separated by spaces.
          # cuda-packs.yml attaches DocuLens-EnginePack-<pack>-<engine tag>.zip (+ .sha256) to the Release of the app
          # version it ran on, and that Release stays their home for every later app version. Add a pair when
          # engines/manifest.json moves to a new tag and the packs have been rebuilt.
          CUDA_PACK_RELEASES: "b12066=v0.1.0"
        run: |
          $tag = "${{ steps.meta.outputs.engine_tag }}"
          $repo = $env:GITHUB_REPOSITORY
          $packs = Join-Path $env:RUNNER_TEMP "packs"
          New-Item -ItemType Directory -Force $packs | Out-Null
          # The packs belong to the llama.cpp tag, not to the app version being built: read them from the Release
          # recorded for that tag — never from "the Release of this version" or "the latest Release".
          $release = $null
          foreach ($pair in ($env:CUDA_PACK_RELEASES -split '\s+')) {
            $kv = $pair -split '=', 2
            if ($kv.Count -eq 2 -and $kv[0] -eq $tag) { $release = $kv[1] }
          }
          if (-not $release) {
            Write-Host "::error::no Release is recorded for the CUDA packs of llama.cpp $tag. Build them with the 'CUDA engine packs (manual)' workflow (publish=true) and add '$tag=<release tag>' to CUDA_PACK_RELEASES in .github/workflows/release-windows.yml."
            exit 1
          }
          Write-Host "CUDA packs of llama.cpp ${tag} are read from Release ${release}"
          foreach ($pack in "cu121", "cu129") {
            $asset = "DocuLens-EnginePack-$pack-$tag.zip"
            gh release download $release --repo $repo --pattern $asset --pattern "$asset.sha256" --dir $packs
            $zip = Join-Path $packs $asset
            if (-not (Test-Path $zip)) {
              Write-Host "::error::$asset is not attached to Release $release. Run the 'CUDA engine packs (manual)' workflow with pack=$pack and publish=true first (engines/README.md, 'Building the CUDA packs')."
              exit 1
            }
            # The .sha256 that cuda-packs.yml uploads next to the zip is required: an unverified pack is not bundled.
            if (-not (Test-Path "$zip.sha256")) { Write-Host "::error::$asset.sha256 is not attached to Release $release, so the pack cannot be verified"; exit 1 }
            $expected = ((Get-Content "$zip.sha256" -Raw).Trim() -split '\s+')[0].ToLower()
            $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            if ($expected -ne $actual) { Write-Host "::error::$asset SHA-256 mismatch: expected $expected, got $actual"; exit 1 }
            Write-Host "$asset sha256 $actual (verified)"
            $dest = "src-tauri/resources/engines/$pack"
            if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
            New-Item -ItemType Directory -Force $dest | Out-Null
            Expand-Archive -Path $zip -DestinationPath $dest -Force
            if (-not (Test-Path "$dest/llama-server.exe")) { Write-Host "::error::$asset does not contain llama-server.exe at its root"; exit 1 }
          }
          exit 0

      - name: Verify the bundled runtime assets (one backend family per pack folder)
        shell: pwsh
        run: |
          $root = "src-tauri/resources"
          $required = @("$root/pdfium/pdfium.dll", "$root/pdfium/LICENSE", "$root/ko-dic/dict.words", "$root/ko-dic/LICENSE-mecab-ko-dic.txt",
                        "$root/engines/cpu/llama-server.exe", "$root/engines/vulkan/llama-server.exe",
                        "$root/engines/cpu/LICENSE-llama.cpp.txt", "$root/engines/vulkan/LICENSE-llama.cpp.txt",
                        "$root/engines/cpu/LICENSE-LLVM-OpenMP", "$root/engines/vulkan/LICENSE-LLVM-OpenMP")
          if ("${{ inputs.variant }}" -eq "full") { $required += @("$root/engines/cu121/llama-server.exe", "$root/engines/cu129/llama-server.exe") }
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { $missing | ForEach-Object { Write-Host "::error::missing bundled asset: $_" }; exit 1 }
          # ggml loads every ggml-*.dll next to llama-server, so a pack folder must hold exactly one GPU backend family
          # (engines/README.md). ggml-cpu-*.dll variants, ggml-base.dll and ggml-rpc.dll are expected in every pack.
          foreach ($dir in Get-ChildItem "$root/engines" -Directory) {
            $families = Get-ChildItem $dir.FullName -Filter "ggml-*.dll" |
              Where-Object { $_.Name -match '^ggml-(cuda|vulkan|opencl|openvino|hip|sycl|musa|cann|blas|webgpu)' } |
              ForEach-Object { $_.Name -replace '^ggml-', '' -replace '\.dll$', '' } | Sort-Object -Unique
            $expected = switch -Regex ($dir.Name) { '^cpu$' { $null } '^vulkan$' { 'vulkan' } '^cu\d+' { 'cuda' } default { Write-Host "::error::unexpected pack folder $($dir.Name)"; exit 1 } }
            $count = (Get-ChildItem $dir.FullName -File | Measure-Object).Count
            Write-Host ("{0}: {1} files, GPU backend: {2}" -f $dir.Name, $count, $(if ($families) { $families -join ', ' } else { 'none (cpu)' }))
            if (@($families).Count -gt 1) { Write-Host "::error::$($dir.Name) mixes backend families: $($families -join ', ')"; exit 1 }
            if ($expected -and ($families -notcontains $expected)) { Write-Host "::error::$($dir.Name) has no ggml-$expected.dll"; exit 1 }
            if (-not $expected -and $families) { Write-Host "::error::the cpu pack contains $($families -join ', ')"; exit 1 }
            if ($expected -eq 'cuda') {
              foreach ($dll in 'cudart64_12.dll', 'cublas64_12.dll', 'cublasLt64_12.dll', 'NVIDIA-CUDA-EULA.txt') {
                if (-not (Test-Path (Join-Path $dir.FullName $dll))) { Write-Host "::error::$($dir.Name) lacks $dll"; exit 1 }
              }
            }
          }
          $all = Get-ChildItem $root -Recurse -File | Measure-Object -Property Length -Sum
          Write-Host ("bundled resources: {0:N0} files, {1:N1} MB" -f $all.Count, ($all.Sum / 1MB))

      # Informational only (PKG-10): the official llama.cpp packs import VCRUNTIME140.dll, VCRUNTIME140_1.dll and
      # MSVCP140.dll without shipping them (checked on the b12066 cpu / vulkan zips), so the engine needs the
      # Microsoft Visual C++ 2015-2022 Redistributable on the user's PC. The script reads the PE import tables itself
      # (no dumpbin / objdump) and prints, per pack, what is imported from outside the pack folder; it never fails
      # the build, and continue-on-error covers the script being absent on an older ref.
      - name: List the DLLs the bundled llama-server packs need from outside (informational)
        continue-on-error: true
        run: node scripts/list-pe-imports.mjs src-tauri/resources/engines

      - name: Generate THIRD-PARTY-NOTICES / SBOM / license texts (bundled by tauri.conf.json)
        run: node scripts/gen-notices.mjs
      - run: npm run build
      # tauri-bundler downloads the NSIS toolset (tauri-apps/binary-releases) into %LOCALAPPDATA%\tauri on first
      # use; cache it so a GitHub release-download outage (HTTP 504 seen on 2026-11-08) cannot fail the bundling step.
      - name: Cache the Tauri bundler tools (NSIS)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\AppData\Local\tauri
          key: tauri-tools-windows-${{ hashFiles('package-lock.json') }}
          restore-keys: tauri-tools-windows-
      # Best effort: pre-seed the toolset with the retrying, API-first downloader (scripts/fetch-nsis.mjs);
      # tauri-bundler keeps verifying it and downloads itself when the seed is absent or wrong.
      - name: Seed the NSIS toolset
        continue-on-error: true
        run: node scripts/fetch-nsis.mjs
      # src-tauri/nsis/installer.nsi is Tauri's template with per-file instead of /SOLID compression
      # (NSIS keeps a solid data block uncompressed behind 32-bit offsets, so the ~3.1 GB Full bundle
      # overflowed its 2 GiB limit); the check fails when the installed CLI embeds a different template.
      - name: Check the NSIS template copy against the installed Tauri CLI
        run: npm run nsis:check

      - name: Build the app and the NSIS installer (retries the bundling step on a download failure)
        shell: pwsh
        run: |
          $attempts = 3
          for ($i = 1; $i -le $attempts; $i++) {
            npx tauri build --target x86_64-pc-windows-msvc
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -lt $attempts) { Write-Host "::warning::tauri build failed (attempt $i of $attempts); retrying in 60 s"; Start-Sleep -Seconds 60 }
          }
          exit 1

      - name: Name the installer and write its SHA-256
        shell: pwsh
        run: |
          $src = Get-ChildItem "target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $src) { Write-Host "::error::NSIS installer not found under target/x86_64-pc-windows-msvc/release/bundle/nsis"; exit 1 }
          New-Item -ItemType Directory -Force dist-installer | Out-Null
          $name = "${{ steps.meta.outputs.installer }}"
          Copy-Item $src.FullName "dist-installer/$name"
          $hash = (Get-FileHash "dist-installer/$name" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/dist-installer/$name.sha256", "$hash *$name`n")
          Write-Host ("{0}  {1}  ({2:N1} MB, {3:N0} bytes)" -f $name, $hash, ($src.Length / 1MB), $src.Length)
          # GitHub Release assets are limited to 2 GiB; NSIS itself stops at a 2 GiB data block.
          if ($src.Length -ge 2GB) { Write-Host "::error::$name is $($src.Length) bytes — over the 2 GiB GitHub Release asset limit"; exit 1 }
          if ($src.Length -ge 1.9GB) { Write-Host "::warning::$name is $($src.Length) bytes — close to the 2 GiB GitHub Release asset limit" }

      # Proves the resources made it into the NSIS archive (tauri.conf.json bundle.resources): the
      # listing is in the log, and a missing required entry fails the build.
      - name: List the installer contents (7-Zip) and check the bundled runtime assets
        shell: pwsh
        run: |
          $name = "${{ steps.meta.outputs.installer }}"
          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue)?.Source
          if (-not $sevenZip) { $sevenZip = "C:\Program Files\7-Zip\7z.exe" }
          $listing = & $sevenZip l "dist-installer/$name" 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::7z could not list $name (exit $LASTEXITCODE); skipping the content check"; $listing | Select-Object -Last 5; exit 0 }
          $text = ($listing | Out-String)
          $required = @("engines\cpu\llama-server.exe", "engines\vulkan\llama-server.exe", "pdfium\pdfium.dll", "ko-dic\", "THIRD-PARTY-NOTICES.md", "sbom.cdx.json", "licenses\THIRD-PARTY-LICENSES.txt")
          if ("${{ inputs.variant }}" -eq "full") { $required += @("engines\cu121\llama-server.exe", "engines\cu129\llama-server.exe") }
          $missing = @($required | Where-Object { $text -notmatch [regex]::Escape($_) })
          # llama-server.exe is a small launcher since llama.cpp split the server into llama-server-impl.dll;
          # print the whole family so the log shows the complete pack.
          $listing | Where-Object { $_ -match "llama[a-z-]*\.(exe|dll)|mtmd[a-z-]*\.dll|ggml[a-z0-9-]*\.dll|cublas[A-Za-z0-9_]*\.dll|cudart[0-9_]*\.dll|EULA|pdfium\.dll|ko-dic|NOTICES|sbom|LICENSES|DocuLens\.exe|\d+ files" } | ForEach-Object { Write-Host $_ }
          if ($missing.Count -gt 0) { Write-Host "::error::bundled assets missing from the installer: $($missing -join ', ')"; exit 1 }
          Write-Host "installer contents OK: $($required.Count) required entries present"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DocuLens-Setup-${{ steps.meta.outputs.variant }}-${{ steps.meta.outputs.version }}-x64
          path: dist-installer/*
          if-no-files-found: error
          compression-level: 0 # the installer is already LZMA-compressed (Full ≈ 1.1 GB)

      - name: Publish to GitHub Release v${{ steps.meta.outputs.version }}
        if: inputs.publish
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $tag = "v$version"
          $repo = $env:GITHUB_REPOSITORY
          # Checked again right before the upload: --clobber below must never replace the assets of a Release whose
          # tag is on another commit than the one built here (scripts/release-guard.mjs; allow_overwrite overrides).
          node scripts/release-guard.mjs --tag $tag --allow-overwrite "${{ inputs.allow_overwrite }}"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          gh release view $tag --repo $repo --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            $sha = (git rev-parse HEAD).Trim()
            Write-Host "creating release $tag at $sha"
            $notes = "docs/releases/$tag.md"
            if (Test-Path $notes) { gh release create $tag --repo $repo --target $sha --title "DocuLens $version" --notes-file $notes }
            else { gh release create $tag --repo $repo --target $sha --title "DocuLens $version" --generate-notes }
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          $name = "${{ steps.meta.outputs.installer }}"
          gh release upload $tag --repo $repo --clobber "dist-installer/$name" "dist-installer/$name.sha256" THIRD-PARTY-NOTICES.md sbom.cdx.json
          exit $LASTEXITCODE
