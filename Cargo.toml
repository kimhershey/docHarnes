[workspace]
resolver = "2"
members = ["crates/doculens-core", "crates/doculens-kodic", "crates/doculens-eval", "src-tauri"]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
encoding_rs = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
nvml-wrapper = "0.11"
tempfile = "3"
sha2 = "0.10"
blake3 = "1"
ureq = { version = "3", default-features = false, features = ["json", "gzip", "native-tls-no-default"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Power"] }
rusqlite = { version = "0.41", features = ["bundled"] }
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "image_latest", "thread_safe"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42"
calamine = { version = "0.38", default-features = false, features = ["dates"] }   # MIT — XLS (BIFF) / XLSB workbooks
cfb = "0.7"                                                                       # MIT — CFB containers (DOC / PPT), same version as the hwp crate
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp", "gif"] }
trash = "5"
hwp = "0.2"
unicode-normalization = "0.1"
# Validators / PII masking patterns (MIT OR Apache-2.0; already in the tree through lindera).
regex = "1"
# PDF page split / merge without re-rendering (MIT).
lopdf = { version = "0.47", default-features = false }
# Korean morphological analyzer (MIT); the ko-dic dictionary (Apache-2.0) is built by crates/doculens-kodic
# from the pinned mecab-ko-dic source and loaded at runtime (never downloaded at build time).
lindera = "6.2"
lindera-dictionary = "6.2"
# Vector search inside SQLite (MIT OR Apache-2.0), statically linked into the bundled SQLite.
sqlite-vec = "0.1.9"
# Exports (design §3.2 BOM): XLSX writer (MIT OR Apache-2.0), CSV (Unlicense OR MIT),
# searchable-PDF text layer writer (MIT OR Apache-2.0).
rust_xlsxwriter = { version = "0.102", default-features = false }
csv = "1.4"
pdf-writer = "0.15"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Keep unwinding: job threads, the HWP parser (which panics on malformed input) and the PDFium
# worker all recover from panics with `catch_unwind`; `abort` would turn them into app crashes.
panic = "unwind"
strip = true
